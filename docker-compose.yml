name: codecritic-local

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - codecritic-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  java-server:
    build:
      context: .
      dockerfile: java-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-codecritic-demo-secret-key-change-me-in-production-0123456789}
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/codecritic
      REDIS_URL: redis://redis:6379
      PYTHON_AGENT_URL: http://python-agent:8000
      PYTHON_AGENT_TOKEN: ${PYTHON_AGENT_TOKEN:-local-agent-token}
      SIMPLYDONE4J_SCHEDULER_ENABLED: "true"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  python-agent:
    build:
      context: ./python-agent
    ports:
      # Host-only for local diagnostics; containers reach it over the Compose
      # network and remote clients should go through the Java server.
      - "127.0.0.1:8000:8000"
    environment:
      JAVA_SERVER_URL: http://java-server:8080/api
      PYTHON_AGENT_TOKEN: ${PYTHON_AGENT_TOKEN:-local-agent-token}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The browser reaches the agent only through Java, so no cross-origin
      # allowlist is needed by default.
      CORS_ALLOW_ORIGINS: ${PYTHON_AGENT_CORS_ALLOW_ORIGINS:-}
    depends_on:
      java-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  codecritic-mongo:
